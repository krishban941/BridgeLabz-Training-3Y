<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Selection Page</title>
</head>
<body>

    <h1>Travel Destination Selection</h1>

    <label for="country">Country:</label>
    <select id="country" name="country">
        <option value="india" selected>India</option>
        <option value="usa">USA</option>
        <option value="uk">United Kingdom</option>
        <option value="japan">Japan</option>
    </select>

    <br><br>

    <label for="state">State:</label>
    <select id="state" name="state">
        <option value="uttar-pradesh" selected>Uttar Pradesh</option>
        <option value="delhi">Delhi</option>
        <option value="rajasthan">Rajasthan</option>
        <option value="maharashtra">Maharashtra</option>
    </select>

    <br><br>

    <label for="city">City:</label>
    <select id="city" name="city">
        <option value="agra" selected>Agra</option>
        <option value="lucknow">Lucknow</option>
        <option value="varanasi">Varanasi</option>
        <option value="kanpur">Kanpur</option>
    </select>

    <br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place" name="place">
        <option value="taj-mahal" selected>Taj Mahal</option>
        <option value="agra-fort">Agra Fort</option>
        <option value="gateway">Gateway of India</option>
        <option value="red-fort">Red Fort</option>
    </select>

    <br><br>

    <p>
        <strong>My Travel Choice:</strong>
        I have selected <b>India</b> as my country,
        <b>Uttar Pradesh</b> as my state,
        <b>Agra</b> as my city, and
        <b>Taj Mahal</b> as my favorite tourist place.
    </p>

</body>
</html>
