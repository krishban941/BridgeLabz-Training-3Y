
<!DOCTYPE html>
<html>
<head>
<title>Laptop Wali Diwali</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    animation: lights 0.5s infinite;
}

@keyframes lights {
    0% { background-color: #ff0000; }
    20% { background-color: #0000ff; }
    40% { background-color: #00a000; }
    60% { background-color: #ff00ff; }
    80% { background-color: #00bfff; }
    100% { background-color: #ff8000; }
}

.content {
    text-align: center;
    padding: 45px;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 25px;
    box-shadow: 0 0 50px white;
}

h1 {
    color: white;
    font-size: 55px;
    text-shadow: 0 0 15px yellow,
                 0 0 30px white;
    margin-bottom: 20px;
}

p {
    color: white;
    font-size: 22px;
    letter-spacing: 2px;
}

.caption {
    margin-top: 25px;
    color: yellow;
    font-size: 18px;
    line-height: 1.8;
}
</style>
</head>

<body>

<div class="content">

    <h1>HAPPY DIWALI</h1>

    <p>My Home, My Laptop, My Lights!</p>

    <div class="caption">
        Log ghar chamka rahe hain...
        <br>
        Hum Laptop!
    </div>

</div>

</body>
</html>
