<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Shoes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="product-card">

        <div class="image-section">

            <img src="shoe.jpg" alt="Premium Running Shoes">

            <span class="discount">20% OFF</span>

            <button class="wishlist">♡</button>

        </div>

        <div class="product-info">

            <p class="category">SPORTS SHOES</p>

            <h2>Premium Running Shoes</h2>

            <div class="rating">
                <span>★</span>
                <span>★</span>
                <span>★</span>
                <span>★</span>
                <span>★</span>
                <span class="reviews">(120)</span>
            </div>

            <div class="price">
                <strong>₹1,999</strong>
                <del>₹2,499</del>
            </div>

            <button class="cart-btn">Add to Cart</button>

        </div>

    </div>

</body>
</html>
