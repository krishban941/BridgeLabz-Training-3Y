<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 352px;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .profile {
            width: 132px;
            height: 132px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background-color: #ddd;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #888;
            font-size: 23px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 29px;
            color: #222;
        }

        h2 {
            margin: 0 0 7px;
            font-size: 20px;
            color: #555;
        }

        .college {
            margin: 0;
            color: #777;
            font-size: 16px;
        }

        .about {
            margin-top: 22px;
            line-height: 26px;
            font-size: 16px;
            color: #555;
        }

        h3 {
            margin: 18px 0 15px;
            font-size: 20px;
            color: #555;
        }

        .skills {
            margin-bottom: 27px;
        }

        .skills span {
            color: #356cff;
            background-color: #f0f0f0;
            font-size: 16px;
            margin: 2px;
        }

        button {
            border: none;
            background-color: #2864e8;
            color: white;
            padding: 11px 25px;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d52c7;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="profile">
            Student
        </div>

        <h1>Rahul Sharma</h1>

        <h2>Computer Science Engineering</h2>

        <p class="college">ABC Institute of Technology</p>

        <p class="about">
            I am a passionate Computer Science<br>
            student interested in Web Development,<br>
            Java, and problem solving.
        </p>

        <h3>Skills</h3>

        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>Java</span>
            <span>Problem Solving</span>
        </div>

        <button>Contact Me</button>

    </div>

</body>
</html>
