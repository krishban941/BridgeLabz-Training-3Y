<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    .box{
        width: 100vw;
        height: 50vh;
        background-color: rgb(105, 122, 184);
        animation: light 0.4ms infinite;
    }
    .box2{
        width: 100vw;
        height: 50vh;
        background-color: rgb(105, 122, 184);
        animation: light2 0.4s infinite;
    }
    @keyframes light {
        0% {
            background-color: rgb(222, 13, 13);
        }
        25% {
            background-color: rgb(205, 249, 8);
        }
        50% {
            background-color: rgb(19, 100, 186);
        }
        75% {
            background-color: rgb(187, 21, 168);
        }
        100% {
            background-color: rgb(17, 220, 41);
        }}
         @keyframes light2 {
        0% {
            
             background-color: rgb(17, 220, 41);
        }
        25% {
            background-color: rgb(187, 21, 168);
        }
        50% {
            background-color: rgb(19, 100, 186);
        }
        75% {
           
             background-color: rgb(205, 249, 8);
        }
        100% {
             background-color: rgb(220, 17, 17);
           
        }
    }
</style>
<body>
    <div class="box">

    </div>
    <div class="box2"></div>
</body>
</html>
